    <!--
      Fraunces axis is intentionally roman-only (no italic axis) to preserve
      the exact pre-Phase-1 rendering of the three existing pages that use
      `font-display italic` (Footer, JoinSection, Login). With the italic
      axis loaded, browsers prefer real italic glyphs over the synthesized
      italic those pages were designed against — a small but real visual
      regression. When the redesign hero/landing is ported and we want
      proper Fraunces italic for `.display-italic` inside `.hy`, re-add
      `ital,` axis here at that time.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
